name: Release

# Push a tag like v0.1.0 (matching package.json "version") to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
        env:
          BEACONBOB_SKIP_MDNS: '1'
          BEACONBOB_SKIP_BROWSER: '1'
      - run: npm run package

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npm run publish:vsce
      - name: Publish to Open VSX (Cursor, VSCodium)
        if: env.OVSX_PAT != ''
        run: npm run publish:ovsx

      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" beaconbob.vsix --title "BeaconBob $GITHUB_REF_NAME" --notes-file CHANGELOG.md
